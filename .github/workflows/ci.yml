name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: for f in public/*.js; do node --check "$f"; done
      - name: HTML
        run: npx --yes html-validate@11.16.2 public/index.html tests/smoke.html
      - name: Smoke test in headless Chrome
        run: tests/run.sh
