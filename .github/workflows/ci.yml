name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: for f in public/*.js; do node --check "$f"; done
      - name: HTML
        run: npx --yes html-validate@11.16.2 public/index.html tests/smoke.html
      - name: Smoke test in headless Chrome
        run: tests/run.sh
      - name: Docker image builds and serves with security headers
        run: |
          docker build -t todos .
          docker run -d --rm -p 8080:8080 --name todos todos
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsI http://127.0.0.1:8080/ | tee /dev/stderr | grep -qi '^content-security-policy:'
          docker rm -f todos
