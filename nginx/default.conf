server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Headers are set once here. nginx drops server-level add_header lines in any location that has its
  # own add_header, so if you ever add one inside a location, include the snippet there too.
  include /etc/nginx/snippets/security-headers.conf;
  # The files are tiny: always revalidate so a deploy never mixes an old index.html with a new app.js.
  add_header Cache-Control "no-cache" always;

  location / { try_files $uri $uri/ =404; }

  # When you add the Postgres/Mongo API, proxy it here so it shares the site's origin. No trailing slash
  # on proxy_pass, so the API receives the full /api/todos path:
  # location /api/ { proxy_pass http://todos-api:3000; }
}
