<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todos smoke test</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; margin: 16px; }
  iframe { width: 1200px; height: 700px; border: 1px solid #ccc; }
  .pass { color: #186b2b; } .fail { color: #b4232f; font-weight: bold; }
</style>
</head>
<body>
<!--
  Drives the real app in an iframe and checks the main flows end to end.
  Serve the repo root (not public/) and open /tests/smoke.html, or run tests/run.sh for a headless pass.
  It uses its own localStorage namespace-free origin data, so run it on a dev server, not your real site.
-->
<pre id="result">RUNNING</pre>
<ol id="log"></ol>
<iframe id="app" title="App under test"></iframe>
<script>
(async () => {
  const frame = document.getElementById("app");
  const log = document.getElementById("log");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // Headless runs use virtual time, so fixed sleeps can finish before real work like reading a file.
  async function waitFor(cond, tries = 500) { for (let i = 0; i < tries && !cond(); i++) await sleep(10); return cond(); }
  let failures = 0, passes = 0;

  function check(name, ok, detail) {
    const li = document.createElement("li");
    li.className = ok ? "pass" : "fail";
    li.textContent = (ok ? "ok   " : "FAIL ") + name + (ok || detail === undefined ? "" : " — " + detail);
    log.append(li);
    ok ? passes++ : failures++;
  }
  function load() {
    return new Promise(resolve => {
      frame.onload = () => resolve();
      frame.src = "../public/index.html?" + Date.now();
    });
  }
  const blank = () => new Promise(resolve => { frame.onload = () => resolve(); frame.src = "about:blank"; });
  const win = () => frame.contentWindow;
  const doc = () => frame.contentDocument;
  const $ = id => doc().getElementById(id);
  const rows = lane => [...doc().querySelectorAll("#list-" + lane + " li[data-id]")].map(li => li.querySelector(".text").textContent);
  const shown = el => el.getClientRects().length > 0; // actually on screen, not just missing the hidden attribute
  const stored = () => JSON.parse(localStorage.getItem("todos.v1") || "[]");
  function type(text) {
    const ta = $("new");
    ta.value = text;
    ta.dispatchEvent(new (win().Event)("input"));
    $("addForm").requestSubmit();
  }
  async function importFile(content) {
    const shown = $("toastMsg").textContent;
    const dt = new (win().DataTransfer)();
    dt.items.add(new (win().File)([content], "backup.json", { type: "application/json" }));
    const input = $("importFile");
    input.files = dt.files;
    input.dispatchEvent(new (win().Event)("change"));
    await waitFor(() => $("toastMsg").textContent !== shown); // the import finished and said so
  }

  try {
    // Make sure the iframe gets the files on disk, not ones the browser cached from an earlier run.
    for (const f of ["index.html", "config.js", "storage.js", "clipboard.js", "relay.js", "qr.js", "app.js", "styles.css"]) await fetch("../public/" + f, { cache: "reload" });
    for (const k of Object.keys(localStorage)) if (k.startsWith("todos.")) localStorage.removeItem(k);

    // A corrupted saved value must not take the page down.
    localStorage.setItem("todos.v1", '{"not":"a list"}');
    await load(); await sleep(100);
    check("survives a corrupted saved list", doc().querySelectorAll(".lane").length === 4 && rows("n").length === 0);
    localStorage.removeItem("todos.v1");
    await load(); await sleep(100);

    check("board renders four lanes", doc().querySelectorAll(".lane").length === 4);
    check("starts empty", stored().length === 0 && $("doneN").textContent === "0");

    // Add one todo with the heat picked by Alt+2 (Simmering).
    $("new").value = "Water the plants";
    $("new").dispatchEvent(new (win().KeyboardEvent)("keydown", { key: "2", code: "Digit2", altKey: true, bubbles: true }));
    $("addForm").requestSubmit();
    check("adds a todo to the picked lane", rows("m").join() === "Water the plants", JSON.stringify(rows("m")));

    // Paste a list: markers stripped, [x] lands in Done, the rest goes to the fridge.
    type("- buy milk\n- [x] call the bank\n2. write README");
    check("pasted list splits into todos", rows("n").join("|") === "buy milk|write README", JSON.stringify(rows("n")));
    check("[x] items count as done", $("doneN").textContent === "1", $("doneN").textContent);

    // Reload: everything comes back from localStorage.
    await load(); await sleep(100);
    check("survives a reload", rows("m").length === 1 && rows("n").length === 2 && $("doneN").textContent === "1");

    // Tick a todo done.
    doc().querySelector("#list-n li[data-id] .check").click();
    await sleep(50);
    check("ticking marks it done", $("doneN").textContent === "2" && stored().filter(t => t.done).length === 2);

    // Export: pick from the Export menu, and capture downloads instead of saving them.
    async function exportVia(kind) {
      let saved = null;
      const A = win().HTMLAnchorElement.prototype, click = A.click;
      A.click = function () { saved = { href: this.href, name: this.download }; };
      $("exportBtn").click();
      doc().querySelector('#menu [data-export="' + kind + '"]').click();
      await sleep(50);
      A.click = click;
      return saved && { name: saved.name, text: await (await fetch(saved.href)).text() };
    }
    const json = await exportVia("json");
    const exported = json && JSON.parse(json.text);
    check("export downloads every todo", exported && exported.app === "todos" && exported.items.length === 4, json && json.name);

    // Plain text: a numbered group per lane, done todos last and struck through, empty lanes skipped.
    const struck = s => [...s].map(c => c + "\u0336").join("");
    const expectedText = "p2\n\n1. Water the plants\n\n\np4\n\n1. write README\n2. " + struck("call the bank") + "\n3. " + struck("buy milk") + "\n";
    const txt = await exportVia("txt");
    check("exports plain text grouped by lane", txt && txt.name.endsWith(".txt") && txt.text === expectedText, txt && JSON.stringify(txt.text));
    let copied = null;
    win().navigator.clipboard.writeText = async t => { copied = t; };
    $("exportBtn").click();
    doc().querySelector('#menu [data-export="copy"]').click();
    await waitFor(() => $("toastMsg").textContent.startsWith("Copied")); // the stub resolves first, the toast follows
    check("copies the same text to the clipboard", copied === expectedText && $("toastMsg").textContent.startsWith("Copied 4 todos"), $("toastMsg").textContent);

    // Import a crafted file: markup must show as text, bad rows are skipped, ids merge.
    const before = stored().length;
    const evil = "<img src=x onerror=\"parent.__xss=1\">";
    await importFile(JSON.stringify({ items: [
      { id: "imp1", text: evil, done: false, prio: "h", created: 1 },
      { id: "imp2", text: "unknown lane", done: false, prio: "zzz", created: 2 },
      { id: 42, text: "bad id" }, { text: "no id" }, null,
      { id: 'q"]', text: "quote in id" }, { id: "imp2", text: "duplicate id" }, { id: "imp3", text: "   " },
    ] }));
    await sleep(100);
    check("import adds valid rows only", stored().length === before + 2, stored().length + " vs " + (before + 2));
    check("imported markup renders as text", rows("h").includes(evil) && !doc().querySelector("#list-h img") && !window.__xss);
    check("unknown lane falls back to the fridge", rows("n").includes("unknown lane"));
    check("crafted, duplicate and blank rows are skipped", !rows("n").includes("quote in id") && !rows("n").includes("duplicate id"));

    // Undo from the toast reverts the whole import.
    $("undo").click();
    await sleep(50);
    check("undo reverts the import", stored().length === before && rows("h").length === 0);

    await importFile("not json");
    check("rejects a non-JSON file", $("toastMsg").textContent.includes("isn't a todos export"), $("toastMsg").textContent);

    // Another tab saves: this tab shows its list without a reload.
    const other = [{ id: "tab2", text: "from another tab", done: false, prio: "l", created: 9 }];
    win().dispatchEvent(new (win().StorageEvent)("storage", { key: "todos.v1", newValue: JSON.stringify(other) }));
    await sleep(50);
    check("picks up another tab's list", rows("l").join() === "from another tab" && rows("n").length === 0, JSON.stringify(rows("l")));

    // ---------- clipboard suggestions ----------
    const filter = win().TodoClipboard.check;
    // None of these are real. Each is assembled at runtime so secret scanners don't flag this file.
    const secrets = {
      "GitHub token": "ghp_" + "a1B2c3D4e5".repeat(3) + "f6G7h8",
      "Anthropic key": "sk-ant-api03-" + "x".repeat(93) + "AA",
      "Postgres URL": ["postgres://admin", "s3cret@db.example.com:5432/app"].join(":"),
      "Mongo URL": ["mongodb+srv://user", "p4ss@cluster0.example.invalid/test"].join(":"),
      "AWS key": "AKIA" + "IOSFODNN7EXAMPLE",
      "JWT": ["eyJhbGciOiJIUzI1NiJ9", "eyJzdWIiOiIxMjM0NTY3ODkwIn0", "dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U"].join("."),
      "private key": "-----BEGIN OPENSSH " + "PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAAA",
      "password": "Tr0ub4dor&3",
      "short password": "hunter2",
      "one-time code": "482913",
      "card number": "4242 4242 4242 4242",
      "env line": "DATABASE_PASSWORD=hunter22",
      "key inside text": "my key is 9fA8sd7f6g5h4j3k2l1qwe8r",
      "token in URL": "https://example.com/reset?token=abc123def456",
      "huge paste": "word ".repeat(600),
    };
    const leaked = Object.entries(secrets).filter(([, v]) => filter(v).ok).map(([k]) => k);
    check("clipboard filter skips secrets", leaked.length === 0, leaked.join(", "));
    const todos = ["Buy oat milk", "Call the dentist at 4pm", "groceries", "https://github.com/NeelkanthTandel/todos/pull/3",
      "Fix auth: refactor login flow", "- buy milk\n- call mom", "Review PR #42 before Friday"];
    const dropped = todos.filter(v => !filter(v).ok);
    check("clipboard filter keeps ordinary todos", dropped.length === 0, JSON.stringify(dropped));

    let chromium = true;
    try { await navigator.permissions.query({ name: "clipboard-read" }); } catch { chromium = false; }
    if (!chromium) {
      check("clipboard suggestions (Chromium only, skipped)", true);
    } else {
      // Opt-in: the offer appears on your first paste, and "No thanks" keeps what you pasted.
      for (const k of Object.keys(localStorage)) if (k.startsWith("todos.")) localStorage.removeItem(k);
      await load(); await sleep(100);
      check("no clipboard offer before you paste", !shown($("clipOffer")) && !shown($("clipNote")) && !shown($("clipToggle")));
      $("new").value = "pasted by hand";
      $("new").dispatchEvent(new (win().Event)("paste"));
      check("offers clipboard suggestions on first paste", shown($("clipOffer")));
      $("clipNo").click();
      check("'No thanks' keeps the pasted text", !shown($("clipOffer")) && shown($("clipToggle")) && $("new").value === "pasted by hand" &&
        localStorage.getItem("todos.clip") === "off" && $("clipToggle").textContent.endsWith("off"));

      // Turned on. The permission prompt can't run headless, so the clipboard is stubbed first and the
      // feature switched on afterwards (it's still "off" from above, so loading reads nothing).
      await load(); await sleep(100);
      let clipText = "";
      win().navigator.clipboard.readText = async () => clipText;
      localStorage.setItem("todos.clip", "on");
      async function comeBack(text) {
        clipText = text;
        let done = false;
        win().addEventListener("todos:clipcheck", () => { done = true; }, { once: true });
        win().dispatchEvent(new (win().Event)("focus"));
        await waitFor(() => done);
      }
      const box = $("new");
      await comeBack("Buy oat milk");
      check("suggests new clipboard text, selected", box.value === "Buy oat milk" && box.selectionStart === 0 &&
        box.selectionEnd === box.value.length && shown($("clipNote")) && $("addBtn").textContent === "Add from clipboard",
        JSON.stringify([box.value, box.selectionStart, box.selectionEnd, $("addBtn").textContent]));
      $("addForm").requestSubmit();
      check("Enter adds the suggestion", rows("n").includes("Buy oat milk") && box.value === "" && !shown($("clipNote")));
      await comeBack("Buy oat milk");
      check("doesn't suggest the same text twice", box.value === "");

      await comeBack("Call the plumber");
      box.dispatchEvent(new (win().KeyboardEvent)("keydown", { key: "Escape", bubbles: true }));
      check("Esc dismisses the suggestion", box.value === "" && !shown($("clipNote")));
      await comeBack("Call the plumber");
      check("a dismissed suggestion stays dismissed", box.value === "");

      await comeBack("Book flights");
      box.value = "x"; box.dispatchEvent(new (win().Event)("input"));
      check("typing replaces the suggestion", box.value === "x" && !shown($("clipNote")) && $("addBtn").textContent === "Add");
      box.value = ""; box.dispatchEvent(new (win().Event)("input"));

      await comeBack("Draft the roadmap");
      box.dispatchEvent(new (win().KeyboardEvent)("keydown", { key: "Tab", bubbles: true }));
      check("Tab keeps it as a draft to edit", box.value === "Draft the roadmap" && !shown($("clipNote")) &&
        box.selectionStart === box.value.length && $("addBtn").textContent === "Add");
      box.value = ""; box.dispatchEvent(new (win().Event)("input"));

      await comeBack("ghp_" + "a1B2c3D4e5".repeat(3) + "f6G7h8");
      check("never suggests a secret", box.value === "");

      $("clipToggle").click();
      await comeBack("Water the garden");
      check("nothing is suggested once turned off", box.value === "" && localStorage.getItem("todos.clip") === "off");
    }

    // ---------- Claude Code sessions, through a fake relay (the todos:relay-seam test seam) ----------
    for (const k of Object.keys(localStorage)) if (k.startsWith("todos.")) localStorage.removeItem(k);
    // Shared with claude-plugin/test/plugin.test.mjs: key = bytes 0..31; the vector was encrypted by the plugin.
    const KEY = "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8";
    const VECTOR = "ZGVmZ2hpamtsbW5vfdefbLvZRtjfyduXx8Tf9nPFLnIH9H0DffCPhtMp3b_GLfc-NA1Ll2fQuSFI0PPthwaQ7gP1w3fTrYj5AKH_Mw1zyi3lnU2fG_8iJsZlNqK4liVnfqMjVcXTIKpgAmMInuCP11RRP5BsjduE_hBwjrwdIFbShIQtXF2F";
    const INBOX_ID = "AAAAAAAAAAAAAAAAAAAAAA";
    localStorage.setItem("todos.inbox", JSON.stringify({ relay: "https://relay.test", id: INBOX_ID, key: KEY, ownerToken: "owner-token" }));
    await load(); await sleep(100);
    check("Connect Claude Code is hidden without a relay", !shown($("claudeBtn")) && $("claudeBtn").hidden);
    check("relay origin is allowed by the CSP when relayBase is set", (() => {
      const base = win().TodoStorage.config.relayBase;
      if (!base) return true;
      const csp = doc().querySelector('meta[http-equiv="Content-Security-Policy"]').content;
      const origin = new URL(base).origin;
      return csp.includes(origin) && csp.includes(origin.replace(/^http/, "ws"));
    })());
    const decoded = await win().TodoRelay.decrypt(KEY, VECTOR);
    check("decrypts a message the plugin encrypted", JSON.stringify(decoded) === JSON.stringify({ event: "suggest", title: "Fix the flaky login test", sessionId: "abc-123", project: "todos", kind: "local", at: 1793000000000 }));

    const relayCalls = [];
    let sock = null;
    class FakeSocket {
      constructor(url, protocols) { this.url = url; this.protocols = protocols; sock = this; setTimeout(() => this.onopen && this.onopen(), 0); }
      send() {}
      close() { this.closed = true; }
    }
    const writerToken = win().TodoRelay.toB64u(new Uint8Array(32).fill(9));
    async function fakeFetch(url, init) {
      relayCalls.push(init.method + " " + url.replace("https://relay.test", ""));
      if (init.headers.Authorization !== "Bearer owner-token") return new Response("{}", { status: 401 });
      if (init.method === "POST" && url.endsWith("/writers")) return new Response(JSON.stringify({ wid: "w2", token: writerToken, created: Date.now() }), { status: 201 });
      if (init.method === "GET" && url.endsWith("/writers")) return new Response(JSON.stringify({ writers: [{ wid: "w1", created: Date.now(), used: Date.now() }] }));
      return new Response(null, { status: 204 });
    }
    win().dispatchEvent(new (win().CustomEvent)("todos:relay-seam", { detail: { base: "https://relay.test", fetch: fakeFetch, WebSocket: FakeSocket } }));
    await waitFor(() => sock);
    check("follows the inbox over a WebSocket, token in a subprotocol", sock && sock.url === "wss://relay.test/c/" + INBOX_ID &&
      sock.protocols.includes("bearer.owner-token") && shown($("claudeBtn")), sock && sock.url);
    check("tray hidden with no suggestions", !shown($("tray")));

    let seq = 0;
    // Waits on the app's event rather than polling: decrypting takes real time, and polling would burn through
    // the virtual time budget tests/run.sh gives headless Chrome.
    function deliverRaw(ev) {
      const handled = new Promise(r => win().addEventListener("todos:relaymsg", r, { once: true }));
      sock.onmessage({ data: JSON.stringify(ev) });
      return handled;
    }
    async function deliver(msg) {
      const id = "m" + ++seq;
      await deliverRaw({ type: "message", id, data: await win().TodoRelay.encrypt(KEY, msg), at: Date.now(), wid: "w1" });
      return id;
    }
    const ev = (event, sessionId, extra = {}) => Object.assign({ event, sessionId, project: "todos", kind: "local", at: Date.now() }, extra);
    const cards = () => [...doc().querySelectorAll("#trayList li[data-session]")];
    const cardFor = id => doc().querySelector('#trayList li[data-session="' + id + '"]');
    const key = (el, k, opts = {}) => el.dispatchEvent(new (win().KeyboardEvent)("keydown", Object.assign({ key: k, bubbles: true, cancelable: true }, opts)));
    const todoFor = id => stored().find(t => t.session && t.session.id === id);

    await deliver(ev("start", "sess-1"));
    check("a session that hasn't been given a task isn't suggested", !shown($("tray")));
    const m2 = await deliver(ev("suggest", "sess-1", { title: "Fix the flaky login test" }));
    let c = cardFor("sess-1");
    check("a suggestion appears with its title and status", shown($("tray")) && c && c.querySelector(".tray-title").textContent === "Fix the flaky login test" &&
      c.dataset.state === "running" && c.querySelector(".tray-meta").textContent.startsWith("Running · todos"), c && c.textContent);
    check("handled messages are deleted from the relay", relayCalls.includes("DELETE /c/" + INBOX_ID + "/messages/" + m2) && relayCalls.includes("DELETE /c/" + INBOX_ID + "/messages/m1"));
    check("suggestions don't look like todos", !c.closest(".board") && getComputedStyle(c).borderStyle === "dashed" && !!c.querySelector(".tray-icon svg"));

    c.focus(); key(c, "Enter");
    let linked = todoFor("sess-1");
    check("Enter adds it to Boiling over with a session link", rows("h").includes("Fix the flaky login test") && linked && linked.prio === "h" &&
      linked.session.state === "running" && linked.session.project === "todos" && !shown($("tray")), JSON.stringify(linked));
    key(doc().activeElement || doc().body, "z", { ctrlKey: true });
    check("undo removes it and puts the suggestion back", !todoFor("sess-1") && !!cardFor("sess-1") && shown($("tray")));
    c = cardFor("sess-1"); c.focus(); key(c, "2");
    check("2 adds it to Simmering", rows("m").includes("Fix the flaky login test") && todoFor("sess-1").prio === "m" && !cardFor("sess-1"));

    await deliver(ev("needs_you", "sess-1"));
    let li = doc().querySelector('#list-m li[data-id="' + todoFor("sess-1").id + '"]');
    check("a status update changes the badge on the added todo", li.querySelector(".sess").dataset.state === "needs_you" &&
      li.querySelector(".sess").textContent === "Needs you" && todoFor("sess-1").session.state === "needs_you");
    check("the page title counts sessions that need you", doc().title === "(1) Todos", doc().title);
    await deliver(ev("running", "sess-1", { at: Date.now() - 60000 }));
    check("an older message arriving late doesn't win", todoFor("sess-1").session.state === "needs_you");
    await deliver(ev("your_turn", "sess-1"));
    check("the badge follows the session", doc().querySelector("#list-m .sess").dataset.state === "your_turn" && doc().title === "Todos", doc().title);

    await deliver(ev("suggest", "sess-2", { title: "Write the release notes" }));
    c = cardFor("sess-2"); c.focus(); key(c, "Escape");
    check("Esc dismisses it", !cardFor("sess-2") && !shown($("tray")));
    await deliver(ev("running", "sess-2"));
    check("a dismissed suggestion stays dismissed", !cardFor("sess-2"));

    const callsBefore = relayCalls.length;
    await deliverRaw({ type: "message", id: "bad1", data: "not base64!", wid: "w1" });
    await deliverRaw({ type: "message", id: "bad2", data: await win().TodoRelay.encrypt("A".repeat(43), ev("suggest", "wrong-key", { title: "x" })), wid: "w1" });
    await deliverRaw({ type: "message", id: "bad3", data: await win().TodoRelay.encrypt(KEY, ["suggest"]), wid: "w1" });
    await deliver(ev("suggest", "big", { title: "x".repeat(5000) }));
    await deliver(ev("suggest", "../../etc", { title: "bad id" }));
    await deliver(ev("explode", "sess-3", { title: "unknown event" }));
    await deliver(ev("suggest", "sess-4", { title: "project too long", project: "p".repeat(500) }));
    await deliverRaw({ type: "message", id: "bad4", data: "A".repeat(40000), wid: "w1" });
    check("malformed, undecryptable or oversized messages are ignored", cards().length === 0 && !shown($("tray")));
    check("…and still cleared from the relay", relayCalls.length - callsBefore === 8 && relayCalls.slice(-8).every(x => x.startsWith("DELETE")));

    const evilTitle = '<img src=x onerror="parent.__xss2=1">';
    await deliver(ev("suggest", "sess-5", { title: evilTitle }));
    check("a title containing markup renders as text", cardFor("sess-5").querySelector(".tray-title").textContent === evilTitle &&
      !doc().querySelector("#trayList img") && !window.__xss2);
    await deliver(ev("suggest", "sess-6", { title: null, project: "api" }));
    check("'Untitled session' fallback", cardFor("sess-6").querySelector(".tray-title").textContent === "Untitled session in api");
    const old = Date.now() - 25 * 3600e3;
    await deliver(ev("suggest", "sess-7", { title: "Long gone", at: old }));
    await deliver(ev("ended", "sess-7", { at: old + 1000 }));
    check("an ended suggestion expires after a day", !cardFor("sess-7"));
    await deliver(ev("suggest", "sess-8", { title: "Ended just now" }));
    await deliver(ev("ended", "sess-8"));
    check("…but stays until then, shown as ended", cardFor("sess-8") && cardFor("sess-8").dataset.state === "ended");
    check("newest suggestion comes first", cards()[0].dataset.session === "sess-8", cards().map(x => x.dataset.session).join());

    doc().activeElement.blur();
    key(doc().body, "a");
    check("A adds the newest suggestion to Boiling over", rows("h").includes("Ended just now") && !cardFor("sess-8"));
    c = cardFor("sess-6"); c.focus(); key(c, "e");
    const edit = c.querySelector(".tray-edit") || cardFor("sess-6").querySelector(".tray-edit");
    edit.value = "Look at the API rate limits"; edit.dispatchEvent(new (win().Event)("input", { bubbles: true }));
    key(edit, "Enter");
    check("E edits the title, then Enter adds it", rows("h").includes("Look at the API rate limits") && todoFor("sess-6").session.project === "api");

    await load(); await sleep(100);
    win().dispatchEvent(new (win().CustomEvent)("todos:relay-seam", { detail: { base: "https://relay.test", fetch: fakeFetch, WebSocket: FakeSocket } }));
    check("suggestions and badges survive a reload", !!cardFor("sess-5") && doc().querySelectorAll(".board .sess").length === 3);

    // Pairing: the dialog shows a /todos:connect command holding this inbox, the key and a new writer token.
    relayCalls.length = 0;
    $("claudeBtn").click();
    await waitFor(() => $("claudeCmd").textContent.startsWith("/todos:connect "));
    const code = $("claudeCmd").textContent.slice("/todos:connect ".length);

    await up;
    check("…and this device's edits go up merged with it", await liveTexts() === "Added on the laptop|First, edited on the phone|Fourth|Old done|Second|Third", await liveTexts());
    await otherDevice(list => { const i = list.findIndex(r => r.text === "Fourth"); list[i] = { id: list[i].id, deleted: true, updated: Date.now() }; });
    check("a delete on another device removes it here, and keeps a tombstone", !rows("n").includes("Fourth") && JSON.parse(localStorage.getItem("todos.tombs")).some(t => t.deleted));

    // 409: another device saves between our read and our write. Ours retries, merging theirs in.
    relaySide.beforePut = () => otherDevice(list => { list.push({ id: "phone1", text: "From the phone, mid-save", done: false, prio: "l", created: 1, pos: 1, updated: Date.now() }); }, { quiet: true });
    const conflictsBefore = relaySide.conflicts;
    up = flushed();
    type("Racing the phone");
    await up;
    check("a 409 conflict re-reads, merges and retries", relaySide.conflicts === conflictsBefore + 1 && (await liveTexts()).includes("From the phone, mid-save") &&
      (await liveTexts()).includes("Racing the phone") && rows("l").includes("From the phone, mid-save"), await liveTexts());

    // Offline: edits wait, then go up when the relay is reachable again.
    relaySide.offline = true;
    type("Written offline");
    await waitFor(() => $("status").textContent.startsWith("Offline"));
    check("offline edits stay here, marked to retry", $("status").textContent === "Offline. Retrying…" && stored().some(t => t.text === "Written offline") && !(await liveTexts()).includes("Written offline"));
    up = flushed();
    relaySide.offline = false;
    await up;
    check("…and are uploaded when back online", (await liveTexts()).includes("Written offline") && $("status").textContent === "Synced", $("status").textContent);

    // Linked devices and unlinking (on the device that started sync).
    relaySide.writers[0].used = Date.now();
    $("syncBtn").click();
    await waitFor(() => $("syncDevices").querySelector("button[data-wid]"));
    check("linked devices are listed with Unlink", $("syncDevices").textContent.includes("Device linked") && !!$("syncDevices").querySelector('button[data-wid="w1"]'));
    $("syncDevices").querySelector('button[data-wid="w1"]').click();
    await waitFor(() => $("toastMsg").textContent.startsWith("Unlinked"));
    check("Unlink revokes that device's token", syncCalls.includes("DELETE /c/" + SYNC_ID + "/writers/w1") && relaySide.revoked.has("w1"));
    $("syncClose").click();

    // A second device links with a code: it has its own todos, so it asks to merge (the default) or replace.
    const putsBeforeLink = relaySide.puts;
    const wt = await (await syncFetch("https://relay.test/c/" + SYNC_ID + "/writers", { method: "POST", headers: { Authorization: "Bearer sync-owner" } })).json();
    const code2 = win().TodoRelay.toB64u(new TextEncoder().encode(JSON.stringify({ relay: "https://relay.test", channelId: SYNC_ID, key: syncKey, writerToken: wt.token })));
    await blank();
    for (const k of Object.keys(localStorage)) if (k.startsWith("todos.")) localStorage.removeItem(k);
    localStorage.setItem("todos.v1", JSON.stringify([{ id: "tab1", text: "Only on the tablet", done: false, prio: "m", created: 5 }]));
    syncSocks.length = 0;
    await load(); await sleep(100);
    syncSeam();
    $("syncBtn").click();
    $("syncCode").value = "not a code"; $("syncLink").click();
    await waitFor(() => !$("syncErr").hidden);
    check("a bad pairing code is refused", $("syncErr").textContent.includes("isn't a pairing code") && !localStorage.getItem("todos.sync"));
    $("syncCode").value = code2; $("syncCode").dispatchEvent(new (win().Event)("input"));
    $("syncLink").click();
    await waitFor(() => !$("syncChoice").hidden);
    check("with todos on both, it asks: Merge both lists (default) or Replace", shown($("syncChoice")) && $("syncMerge").checked && !$("syncReplace").checked && !localStorage.getItem("todos.sync"));
    up = flushed();
    $("syncLink").click();
    await up;
    const linkedCfg = JSON.parse(localStorage.getItem("todos.sync") || "null");
    check("Merge both lists keeps both, here and on the relay", rows("m").includes("Only on the tablet") && rows("n").includes("Added on the laptop") &&
      (await liveTexts()).includes("Only on the tablet") && relaySide.puts > putsBeforeLink && linkedCfg && linkedCfg.token === wt.token && !linkedCfg.ownerToken, JSON.stringify(rows("m")));
    const wsLinked = syncSocks.find(s => s.url === "wss://relay.test/c/" + SYNC_ID && !s.closed);
    check("a linked device follows with its own writer token", wsLinked && wsLinked.protocols.includes("bearer." + wt.token));
    check("a linked device can't add or unlink devices", shown($("syncNotOwner")) && !shown($("syncShowCode")));
    $("syncClose").click();

    // Unlinked from the first device: the socket closes with 4001 and this device stops syncing.
    relaySide.revoked.add(wt.wid);
    wsLinked.onclose({ code: 4001 });
    await waitFor(() => !localStorage.getItem("todos.sync"));
    check("an unlinked device stops syncing and keeps its list", !localStorage.getItem("todos.sync") && $("syncBtn").textContent === "Sync across devices" &&
      $("toastMsg").textContent.includes("unlinked") && rows("m").includes("Only on the tablet"));
    const putsAfterUnlink = relaySide.puts;
    type("After unlinking");
    await sleep(200);
    check("…and its edits no longer reach the relay", relaySide.puts === putsAfterUnlink && !(await liveTexts()).includes("After unlinking"));

    // A third device picks Replace: its own list is swapped for the synced one.
    const wt3 = await (await syncFetch("https://relay.test/c/" + SYNC_ID + "/writers", { method: "POST", headers: { Authorization: "Bearer sync-owner" } })).json();
    const code3 = win().TodoRelay.toB64u(new TextEncoder().encode(JSON.stringify({ relay: "https://relay.test", channelId: SYNC_ID, key: syncKey, writerToken: wt3.token })));
    await blank();
    for (const k of Object.keys(localStorage)) if (k.startsWith("todos.")) localStorage.removeItem(k);
    localStorage.setItem("todos.v1", JSON.stringify([{ id: "old9", text: "Stale list on the old phone", done: false, prio: "h", created: 5 }]));
    await new Promise(resolve => { frame.onload = resolve; frame.src = "../public/index.html?" + Date.now(); });
    await sleep(50);
    syncSeam();
    win().location.hash = "#sync=" + code3; // what scanning the QR code opens
    await waitFor(() => $("syncDialog").open);
    check("opening a #sync= link (the QR code) opens the dialog with the code filled in", $("syncCode").value === code3 && win().location.hash === "");
    $("syncLink").click();
    await waitFor(() => !$("syncChoice").hidden);
    $("syncReplace").checked = true;
    $("syncLink").click();
    await waitFor(() => !!localStorage.getItem("todos.sync"));
    await sleep(100);
    check("Replace this device's list takes the synced list instead", !rows("h").includes("Stale list on the old phone") && rows("n").includes("Added on the laptop") &&
      !(await liveTexts()).includes("Stale list on the old phone"), JSON.stringify(rows("h")));
    $("syncOffBtn").click(); $("syncOffBtn").click();
    check("Turn off sync stops syncing on this device", !localStorage.getItem("todos.sync") && $("toastMsg").textContent.startsWith("Sync is off"));
    $("syncClose").click();
  } catch (e) {
    check("no exceptions", false, e && e.stack || String(e));
  }
  for (const k of Object.keys(localStorage)) if (k.startsWith("todos.")) localStorage.removeItem(k);
  document.getElementById("result").textContent = (failures ? "FAIL" : "PASS") + " " + passes + "/" + (passes + failures);
})();
</script>
</body>
</html>
